  previous-page: "◀ Page précédente"
  next-page: "Page suivante ▶"

help:
  - "/replay record start [nom] [map] | stop [nom] | list | marker <nom>"
  - "/replay menu | list | play <replay> | info <replay> | delete <replay>"
  - "/replay toggle | speed <x> | seek <temps> | skip <±secondes> | pov <joueur> | free | invite <joueur> | leave"

usage:
  speed: "/replay speed <0.1-10>"
