# ClaudeReplay - messages en français
# Les variables s'écrivent {nom}. Une clé absente ici est reprise du fichier fourni avec le plugin.

general:
  no-permission: "Tu n'as pas la permission."
  players-only: "Commande réservée aux joueurs."
  not-watching: "Tu ne regardes aucun replay."
  invalid-number: "Nombre invalide : {value}"
