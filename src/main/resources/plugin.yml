name: ClaudeReplay
version: '${version}'

main: fr.bebedlastreat.claudeReplay.ClaudeReplay
api-version: '26.3'
load: POSTWORLD
depend: [ packetevents ]

authors: [ BebeDlaStreat, Claude ]
description: Records what players see and replays it in game.

commands:
  replay:
    description: Record and watch replays.
    usage: /replay
    aliases: [ replays, crp ]

permissions:
  claudereplay.record:
    description: Start and stop recordings.
    default: op
  claudereplay.play:
    description: List and watch replays.
    default: op
  claudereplay.admin:
    description: Delete replays.
    default: op
    children:
      claudereplay.record: true
      claudereplay.play: true
