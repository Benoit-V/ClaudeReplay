name: ClaudeReplay
version: '${version}'

main: fr.bebedlastreat.claudeReplay.ClaudeReplay
api-version: '26.3'
load: POSTWORLD
depend: [ packetevents ]

authors: [ BebeDlaStreat, Claude ]
description: Enregistre ce que voient les joueurs et le rejoue en jeu.

commands:
  replay:
    description: Enregistrer et regarder des replays.
    usage: /replay
    aliases: [ replays, crp ]

permissions:
  claudereplay.record:
    description: Démarrer et arrêter des enregistrements.
    default: op
  claudereplay.play:
    description: Lister et regarder des replays.
    default: op
  claudereplay.admin:
    description: Supprimer des replays.
    default: op
    children:
      claudereplay.record: true
      claudereplay.play: true
